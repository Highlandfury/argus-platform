openapi: 3.1.0
info:
  title: Argus Phase-1 API
  version: 0.1.0
  description: >
    Minimal API surface for the Phase-1 walking skeleton: local auth, enrollment tokens,
    collector registry, and one metric query. Conventions (problem+json, cursor pagination,
    X-Request-ID, CSRF double-submit, Idempotency-Key) follow the architecture package §22.
    Session auth uses the `argus_session` cookie; unsafe methods additionally require
    `X-CSRF-Token` matching the `argus_csrf` cookie.
    Inventory operations additionally declare `x-argus-capability` (required RBAC-SC
    capability) and `x-argus-scope` (org|site|device_group|device); the contract test
    compares these against the route registry so an implemented inventory route without
    enforcement metadata (or with mismatched metadata) fails CI. Credential operations
    declare the same extensions (scope `org`; the binding target scope is validated
    server-side). Credentials are write-only: no route, response, or query returns
    secret material — `GET` returns metadata only.
servers:
  - url: http://localhost:8080
    description: Local dev
tags:
  - name: auth
  - name: identity
  - name: tenancy
  - name: collectors
  - name: metrics
  - name: inventory
  - name: credentials
  - name: ops

paths:
  /v1/auth/login:
    post:
      tags: [auth]
      summary: Local login (org slug + email + password)
      security: []          # public; rate-limited 10/min/IP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session established; Set-Cookie argus_session + argus_csrf
          headers:
            Set-Cookie: { schema: { type: string }, description: "argus_session=...; HttpOnly; SameSite=Lax; Path=/ ; argus_csrf=... (readable)" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke current session
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/me:
    get:
      tags: [identity]
      summary: Current user, organization, role
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/sites:
    get:
      tags: [tenancy]
      summary: List sites of the current organization
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Site' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/enrollments:
    get:
      tags: [collectors]
      summary: List enrollment token metadata (never raw tokens)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/EnrollmentToken' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [collectors]
      summary: Create a one-time enrollment token (raw token returned exactly once)
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentTokenCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentTokenCreated' }
        '400': { $ref: '#/components/responses/Validation' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/collectors:
    get:
      tags: [collectors]
      summary: List collectors (org-scoped)
      parameters:
        - { name: 'filter[site_id]', in: query, schema: { type: string, format: uuid } }
        - { name: 'filter[status]', in: query, schema: { type: string, enum: [pending, active, stale, revoked] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Collector' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/collectors/{id}:
    get:
      tags: [collectors]
      summary: Collector detail (identity, status, policy, certificate, spool stats)
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectorDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/collectors/{id}/revoke:
    post:
      tags: [collectors]
      summary: Revoke a collector (idempotent)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '200':
          description: Revoked (or already revoked)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collector' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/collectors/{id}/policy:resync:
    post:
      tags: [collectors]
      summary: Issue the next policy version for a collector
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '202':
          description: Accepted; policy version incremented and queued for delivery
          content:
            application/json:
              schema:
                type: object
                required: [policy_version]
                properties: { policy_version: { type: integer } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/collectors/{id}/metrics:
    get:
      tags: [metrics]
      summary: Query one metric series for a collector (chart feed)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: metric, in: query, required: true, schema: { type: string, enum: [collector_cpu_percent] } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: step, in: query, schema: { type: string, enum: [auto, raw, 10s, 30s, 1m, 5m, 1h, 1d], default: auto }, description: "auto applies the canonical resolution picker (docs/08 §13.5); explicit steps are honored with a warning when finer than the picker's recommendation" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricSeries' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Query exceeds the supported point budget (query.points_exceeded); responses otherwise cap at 10k points / 100 series with partial=true
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '504':
          description: Query timeout
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/metrics/query:
    post:
      tags: [metrics]
      summary: Multi-series metrics query (matrix results, null gaps, canonical caps)
      x-argus-capability: device.read
      x-argus-scope: site
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetricsQueryRequest' }
      responses:
        '200':
          description: OK; matrix per series with explicit null gaps (never interpolated)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsQueryResponse' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: One or more explicit series ids are unknown, foreign or outside the caller's scope (uniform series.not_found; no existence oracle)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Unsupported aggregation (query.agg_unsupported) or scan budget exceeded (query.points_exceeded)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '504':
          description: Query timeout
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [metrics]
      summary: URL-encoded convenience form (cached 30 s; ETag/If-None-Match -> 304)
      x-argus-capability: device.read
      x-argus-scope: site
      parameters:
        - { name: series, in: query, schema: { type: string }, description: "Opaque series id (s_…); repeat the parameter or use a comma-separated list" }
        - { name: device_id, in: query, schema: { type: string, format: uuid }, description: Selector device (requires metric) }
        - { name: metric, in: query, schema: { type: string }, description: Selector metric key (requires device_id) }
        - { name: dimensions, in: query, schema: { type: string }, description: "Selector dimension subset in compact k=v,k2=v2 form" }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: step, in: query, schema: { type: string, enum: [auto, raw, 10s, 30s, 1m, 5m, 1h, 1d], default: auto } }
        - { name: agg, in: query, schema: { type: string, enum: [avg, max, p95, rate, sum], default: avg } }
        - { name: fill, in: query, schema: { type: string, enum: [null, zero, previous], default: null } }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsQueryResponse' }
        '304':
          description: Not modified (ETag matches)
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: One or more explicit series ids are unknown, foreign or outside the caller's scope (uniform series.not_found)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Unsupported aggregation (query.agg_unsupported) or scan budget exceeded (query.points_exceeded)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '504':
          description: Query timeout
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/devices:
    get:
      tags: [inventory]
      summary: List devices (cursor pagination, soft-deleted hidden by default)
      x-argus-capability: device.read
      x-argus-scope: site
      parameters:
        - { name: 'filter[site_id]', in: query, schema: { type: string, format: uuid } }
        - { name: 'filter[status]', in: query, schema: { type: string, enum: [new, up, down, degraded, maintenance, retired] } }
        - { name: 'filter[kind]', in: query, schema: { type: string } }
        - name: include
          in: query
          schema: { type: string, enum: [status] }
          description: "`status` adds a `poll_status` rollup object per device (M10-S1, derived from scheduled poll health). The existing `status` field remains the inventory lifecycle state."
        - { name: include_deleted, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
          description: "`desc` returns newest first (UUIDv7 id order) and the cursor walks backwards; the default `asc` preserves the historical cursor contract."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Device' } }
                  next_cursor: { type: [string, 'null'] }
                  has_more: { type: boolean }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [inventory]
      summary: Add a manual device (admin)
      x-argus-capability: device.write
      x-argus-scope: site
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/devices/{id}:
    get:
      tags: [inventory]
      summary: Device detail
      x-argus-capability: device.read
      x-argus-scope: device
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: include_deleted, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [inventory]
      summary: Update a device (admin; omitted fields unchanged, null clears nullable fields)
      x-argus-capability: device.write
      x-argus-scope: device
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [inventory]
      summary: Soft-delete a device (admin)
      x-argus-capability: device.write
      x-argus-scope: device
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '204': { description: Soft-deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/devices/{id}/identity-history:
    get:
      tags: [inventory]
      summary: Identity attribute history of a device (open rows have null last_seen_at)
      x-argus-capability: device.identity.read
      x-argus-scope: device
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/IdentityRecord' } }
                  next_cursor: { type: [string, 'null'] }
                  has_more: { type: boolean }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/devices/{id}/identities:
    post:
      tags: [inventory]
      summary: 'Open an identity-history window for a device (admin; idempotent per key)'
      description: >
        Records one identity key as an open `device_identity_history` window
        (`source=manual`, `last_seen_at` null). Repeating the same key for the same
        device returns the existing open row (201); a key already open on another
        live device is a deterministic `409 device.identity_conflict` via the
        partial unique index. Device columns (serial, sysObjectID, management IP)
        are NOT modified by this operation; they change through PATCH transitions.
      x-argus-capability: device.write
      x-argus-scope: device
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityCreate' }
      responses:
        '201':
          description: Open identity window (the existing row for idempotent repeats)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityRecord' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/devices/{id}/identities/{historyId}/close:
    post:
      tags: [inventory]
      summary: 'Close an identity-history window (admin; idempotent repeat close)'
      description: >
        Closes the open window identified by `historyId` (stamps `last_seen_at`).
        Repeat closes are idempotent and return the already-closed row without a
        new audit event; unknown rows/foreign devices are uniformly 404.
      x-argus-capability: device.write
      x-argus-scope: device
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: historyId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '200':
          description: Closed window returned (already-closed rows unchanged)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityRecord' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/devices/{id}/poll-health:
    get:
      tags: [inventory]
      summary: Poll outcomes for a device, newest first (M9-S1; 90-day retention)
      x-argus-capability: device.read
      x-argus-scope: device
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PollHealthRecord' } }
                  next_cursor: { type: [string, 'null'] }
                  has_more: { type: boolean }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/devices/{id}/status:
    get:
      tags: [inventory]
      summary: Derived device status rollup from scheduled poll health (up/down/unknown)
      x-argus-capability: device.read
      x-argus-scope: device
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK (unknown with null fields when no scheduled health exists)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/devices/{id}/checks:
    post:
      tags: [inventory]
      summary: Trigger an immediate on-demand ICMP/SNMP check for a device (admin; Idempotency-Key required, 202 + status_url)
      x-argus-capability: diagnostic.run
      x-argus-scope: device
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CsrfToken' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
          description: Required. A replay with the same key (same device) returns the original check with Idempotent-Replayed true.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckCreate' }
      responses:
        '202':
          description: Accepted; the check runs on the device site's collector (pending until the result arrives)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Check' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: No collector for the device site, per-device pending ceiling reached (check.pending_limit), or a different device already owns the key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/checks:
    get:
      tags: [inventory]
      summary: Org-wide on-demand check ledger, newest first by default (cursor = check id)
      description: >
        M10-S3b-3 operator ledger. Newest first by default (order=desc; UUIDv7
        ids are time-ordered); order=asc mirrors the devices-list additive order
        contract. Cursor-paged by check id. Scope-filtered exactly like the
        devices list: rows whose device site is outside the caller's bindings
        are invisible. An explicit filter[device_id] outside the caller's scope
        is a deterministic 403 (M7 list-filter rule); pending rows past their
        TTL are lazily failed as expired before the page is read.
      x-argus-capability: device.read
      x-argus-scope: site
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string }, description: Check id from next_cursor; pages walk by id in the requested order }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc }, description: desc = newest first (default); asc = oldest first }
        - { name: 'filter[status]', in: query, schema: { type: string, enum: [pending, completed, failed] } }
        - { name: 'filter[poll_type]', in: query, schema: { type: string, enum: [icmp, snmp] } }
        - { name: 'filter[device_id]', in: query, schema: { type: string, format: uuid }, description: Out-of-scope device ids are a deterministic 403 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Check' } }
                  next_cursor: { type: [string, 'null'] }
                  has_more: { type: boolean }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/checks/{id}:
    get:
      tags: [inventory]
      summary: On-demand check status/outcome (pending until the collector reports; 404 for unknown or out-of-scope checks)
      x-argus-capability: device.read
      x-argus-scope: device
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Check' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/poll-health:
    get:
      tags: [inventory]
      summary: Bounded recent poll-health feed (ts DESC; default 1 h, max 24 h window; no deep pagination)
      description: >
        M10-S3b-3 operator feed. Filters outcome (success|failure), poll_type
        (icmp|snmp) and device_id; since is RFC3339 (default now-1h) and must
        fall within the last 24 hours; limit is 1..200 (default 50). Ordered
        ts DESC; there is no cursor because the feed is bounded by the window
        and limit. Scope-filtered exactly like the devices list; an explicit
        out-of-scope device_id is a deterministic 403.
      x-argus-capability: device.read
      x-argus-scope: site
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: since, in: query, schema: { type: string, format: date-time }, description: RFC3339 lower bound; defaults to now-1h and must be within the last 24h (a 60 s clock-skew grace applies at the exact boundary) }
        - { name: outcome, in: query, schema: { type: string, enum: [success, failure] } }
        - { name: poll_type, in: query, schema: { type: string, enum: [icmp, snmp] } }
        - { name: device_id, in: query, schema: { type: string, format: uuid }, description: Out-of-scope device ids are a deterministic 403 }
      responses:
        '200':
          description: OK (newest first; `since` echoes the effective window start)
          content:
            application/json:
              schema:
                type: object
                required: [data, since]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PollHealthRecord' } }
                  since: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/devices/{id}/merge:
    post:
      tags: [inventory]
      summary: 'Merge source devices into {id}: re-points identity history + interfaces, soft-deletes sources (admin)'
      x-argus-capability: device.merge
      x-argus-scope: device
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceMergeRequest' }
      responses:
        '200':
          description: Merged; target device returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/devices/{id}/split:
    post:
      tags: [inventory]
      summary: 'Split identity-history rows off {id} into a new device (admin)'
      x-argus-capability: device.split
      x-argus-scope: device
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceSplitRequest' }
      responses:
        '201':
          description: New device created; identity rows re-pointed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/devices/{id}/interfaces:
    get:
      tags: [inventory]
      summary: List interfaces of a device
      x-argus-capability: interface.read
      x-argus-scope: device
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Interface' } }
                  next_cursor: { type: [string, 'null'] }
                  has_more: { type: boolean }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [inventory]
      summary: Add a manual interface to a device (admin; UQ(device_id, if_index))
      x-argus-capability: interface.write
      x-argus-scope: device
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterfaceCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interface' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/interfaces/{id}:
    get:
      tags: [inventory]
      summary: Interface detail
      x-argus-capability: interface.read
      x-argus-scope: device
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interface' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [inventory]
      summary: Update editable interface metadata (admin; if_index is immutable)
      x-argus-capability: interface.write
      x-argus-scope: device
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterfaceUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interface' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [inventory]
      summary: Delete an interface (admin; the 000008 shape has no deleted_at)
      x-argus-capability: interface.write
      x-argus-scope: device
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/device-groups:
    get:
      tags: [inventory]
      summary: List device groups
      x-argus-capability: device_group.read
      x-argus-scope: device_group
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DeviceGroup' } }
                  next_cursor: { type: [string, 'null'] }
                  has_more: { type: boolean }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [inventory]
      summary: Create a dynamic device group (admin; selector is a jsonb object)
      x-argus-capability: device_group.write
      x-argus-scope: org
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceGroupCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceGroup' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/device-groups/{id}:
    get:
      tags: [inventory]
      summary: Device group detail
      x-argus-capability: device_group.read
      x-argus-scope: device_group
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceGroup' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [inventory]
      summary: Update a device group (admin)
      x-argus-capability: device_group.write
      x-argus-scope: device_group
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceGroupUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceGroup' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [inventory]
      summary: Delete a device group (admin)
      x-argus-capability: device_group.write
      x-argus-scope: device_group
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/credentials:
    get:
      tags: [credentials]
      summary: List credential metadata (never secret material; write-only surface)
      description: >
        Returns metadata and binding summaries only. No operation, response, or
        query parameter can read a secret back: secrets are write-only for every
        role (docs/04 §6.2, docs/14 §24.5).
      x-argus-capability: credential.read_metadata
      x-argus-scope: org
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK (metadata only)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CredentialMetadata' } }
                  next_cursor: { type: [string, 'null'] }
                  has_more: { type: boolean }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [credentials]
      summary: Create a credential (secret submitted once; metadata-only response)
      description: >
        The `secret` is sealed with envelope encryption (per-secret DEK, AES-256-GCM,
        encryption context bound to org/type/id/version) and is never returned,
        logged, or stored in plaintext.
      x-argus-capability: credential.write
      x-argus-scope: org
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialCreate' }
      responses:
        '201':
          description: Created (metadata only; the secret is not in the response)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialMetadata' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/credentials/{id}:
    get:
      tags: [credentials]
      summary: Credential metadata detail (metadata only; there is no secret read)
      x-argus-capability: credential.read_metadata
      x-argus-scope: org
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK (metadata only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialMetadata' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/credentials/{id}/rotate:
    post:
      tags: [credentials]
      summary: Rotate a credential (new secret; atomic envelope replacement; metadata-only response)
      description: >
        Re-seals the credential under a fresh per-secret DEK in one transaction and
        stamps rotated_at. The previous envelope bytes are replaced, not kept.
      x-argus-capability: credential.rotate
      x-argus-scope: org
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialRotateRequest' }
      responses:
        '200':
          description: Rotated (metadata only; the new secret is not in the response)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialMetadata' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/credentials/{id}/bind:
    post:
      tags: [credentials]
      summary: Bind a credential to a scope target (org|site|device_group|device)
      description: >
        The target is resolved server-side against the tenant's sites /
        device_groups / devices tables (org targets must be the caller's own
        org); a foreign or unknown target is uniformly 404 with no existence
        oracle. Duplicate bindings are a deterministic 409.
      x-argus-capability: credential.write
      x-argus-scope: org
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialBindRequest' }
      responses:
        '201':
          description: Bound
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialBinding' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/credentials/{id}/unbind:
    post:
      tags: [credentials]
      summary: Remove a credential binding by (scope_type, scope_id)
      description: >
        Unbind deliberately does not resolve the target, so stale bindings can be
        cleaned up after a target row was deleted.
      x-argus-capability: credential.write
      x-argus-scope: org
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialUnbindRequest' }
      responses:
        '204': { description: Unbound }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/healthz:
    get:
      tags: [ops]
      summary: Liveness
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /v1/readyz:
    get:
      tags: [ops]
      summary: Readiness (DB reachable, migrations current)
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: argus_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: Must match the argus_csrf cookie (double-submit), required on unsafe methods.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Replays within 24h return the original response with Idempotent-Replayed true.
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Validation:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: Not authenticated
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Insufficient role or CSRF failure
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found (also used for out-of-scope resources; no existence oracle)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Identity conflict (device.name_conflict, device.merge_conflict, interface.if_index_conflict, device_group.name_conflict)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Rate limited
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: 'Stable machine code, e.g. auth.unauthenticated' }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
        request_id: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        version: { type: string }
        commit: { type: string }
        checks:
          type: object
          additionalProperties: { type: string }
    LoginRequest:
      type: object
      required: [org_slug, email, password]
      properties:
        org_slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    Me:
      type: object
      required: [user, org]
      properties:
        user: { $ref: '#/components/schemas/User' }
        org: { $ref: '#/components/schemas/Org' }
    User:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, viewer] }
    Org:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
    Site:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    EnrollmentTokenCreate:
      type: object
      properties:
        site_id: { type: string, format: uuid, description: Optional site binding; defaults to org-wide token }
        ttl_seconds: { type: integer, minimum: 60, maximum: 604800, default: 86400 }
    EnrollmentToken:
      type: object
      required: [id, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: [string, 'null'], format: uuid }
        expires_at: { type: string, format: date-time }
        used_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    EnrollmentTokenCreated:
      allOf:
        - $ref: '#/components/schemas/EnrollmentToken'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: 'Raw token (arg_enr_...), shown exactly once. Store securely.'
    Collector:
      type: object
      required: [id, name, site_id, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        site_id: { type: string, format: uuid }
        site_name: { type: string }
        status: { type: string, enum: [pending, active, stale, revoked] }
        agent_version: { type: [string, 'null'] }
        last_heartbeat_at: { type: [string, 'null'], format: date-time }
        last_stream_at: { type: [string, 'null'], format: date-time }
        enrolled_at: { type: [string, 'null'], format: date-time }
    CollectorDetail:
      allOf:
        - $ref: '#/components/schemas/Collector'
        - type: object
          properties:
            hostname: { type: [string, 'null'] }
            os: { type: [string, 'null'] }
            policy:
              type: object
              properties:
                issued_version: { type: integer }
                acked_version: { type: integer }
                pending: { type: boolean }
            certificate:
              type: object
              properties:
                not_after: { type: string, format: date-time }
                revoked_at: { type: [string, 'null'], format: date-time }
            connection:
              type: object
              properties:
                connected: { type: boolean, description: 'Derived: last_stream_at within 2x heartbeat interval' }
                heartbeat_age_seconds: { type: [integer, 'null'] }
            reported_stats:
              type: object
              properties:
                spool_bytes: { type: integer }
                spool_records: { type: integer }
                highest_seq: { type: integer }
                acked_seq: { type: integer }
                dropped_records_total: { type: integer }
                corrupt_records_total: { type: integer }
                clock_skew_ms: { type: integer }
            metrics_received:
              type: object
              properties:
                total_samples: { type: integer }
                last_sample_at: { type: [string, 'null'], format: date-time }
    Device:
      type: object
      required: [id, site_id, name, kind, status, poll_profile, critical, confidence, first_seen_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        zone_id: { type: [string, 'null'], format: uuid }
        name: { type: string, maxLength: 200 }
        kind: { type: string }
        vendor_id: { type: [string, 'null'], format: uuid }
        model_id: { type: [string, 'null'], format: uuid }
        sys_object_id: { type: [string, 'null'] }
        serial: { type: [string, 'null'] }
        firmware: { type: [string, 'null'] }
        mgmt_ip: { type: [string, 'null'], description: PostgreSQL inet rendered as text }
        status: { type: string, enum: [new, up, down, degraded, maintenance, retired] }
        poll_profile: { type: string }
        critical: { type: boolean, description: 'Critical device: the collector lowers the failure-backoff ceiling to 5 min (docs/07 §12.3)' }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        metadata: { type: object, additionalProperties: true }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: [string, 'null'], format: date-time }
        deleted_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        poll_status:
          allOf: [{ $ref: '#/components/schemas/DeviceStatus' }]
          description: Present only when the list is requested with include=status (M10-S1).
    DeviceCreate:
      type: object
      required: [site_id, name, kind]
      properties:
        site_id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        kind: { type: string }
        poll_profile: { type: string, default: standard }
        critical: { type: boolean, default: false, description: 'Critical device: collector failure-backoff ceiling 5 min instead of 15' }
        sys_object_id: { type: [string, 'null'] }
        serial: { type: [string, 'null'] }
        firmware: { type: [string, 'null'] }
        mgmt_ip: { type: [string, 'null'], description: IPv4/IPv6 address }
        metadata: { type: object, additionalProperties: true }
        identities:
          type: array
          description: Extra identity keys recorded in device_identity_history (serial/sysObjectID/mgmt_ip are recorded automatically from device fields).
          items:
            type: object
            required: [type, value]
            properties:
              type: { type: string, enum: [serial, chassis_id, sys_object_id, mac, hostname, mgmt_ip] }
              value: { type: string }
    DeviceUpdate:
      type: object
      description: All fields optional; omitted fields are unchanged and null clears nullable fields.
      properties:
        site_id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        kind: { type: string }
        status: { type: string, enum: [new, up, down, degraded, maintenance, retired] }
        poll_profile: { type: string }
        critical: { type: boolean }
        sys_object_id: { type: [string, 'null'] }
        serial: { type: [string, 'null'] }
        firmware: { type: [string, 'null'] }
        mgmt_ip: { type: [string, 'null'] }
        metadata: { type: object, additionalProperties: true }
    DeviceMergeRequest:
      type: object
      required: [source_device_ids]
      properties:
        source_device_ids: { type: array, minItems: 1, items: { type: string, format: uuid } }
        reason: { type: string }
    DeviceSplitRequest:
      type: object
      required: [identity_history_ids, name]
      properties:
        identity_history_ids: { type: array, minItems: 1, items: { type: string, format: uuid } }
        name: { type: string, maxLength: 200, description: Name of the new device }
        kind: { type: string, description: Defaults to the source device's kind }
        site_id: { type: string, format: uuid, description: Defaults to the source device's site }
        reason: { type: string }
    CheckCreate:
      type: object
      required: [poll_type]
      properties:
        poll_type: { type: string, enum: [icmp, snmp] }
    Check:
      type: object
      required: [check_id, device_id, poll_type, status, outcome, error_class, created_at, status_url]
      properties:
        check_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        collector_id: { type: [string, 'null'], format: uuid, description: Collector selected at request time }
        poll_type: { type: string, enum: [icmp, snmp] }
        status: { type: string, enum: [pending, completed, failed], description: 'pending until the collector reports; failed = server-side non-execution (expired)' }
        outcome: { type: string, enum: ['', success, failure], description: 'Probe outcome; empty until completed' }
        error_class: { type: string, description: 'timeout | unreachable | loss | auth_failure | rate_limited | target_missing | expired | ... (same vocabulary as poll health)' }
        latency_ms: { type: [integer, 'null'], minimum: 0, description: Whole-probe duration in milliseconds }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        status_url: { type: string, description: 'GET path for this check' }
    IdentityRecord:
      type: object
      required: [id, device_id, identifier_type, identifier_value, source, first_seen_at, created_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        identifier_type: { type: string, enum: [serial, chassis_id, sys_object_id, mac, hostname, mgmt_ip] }
        identifier_value: { type: string }
        source: { type: string, enum: [manual, snmp, lldp, discovery] }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: [string, 'null'], format: date-time, description: null = open window }
        created_at: { type: string, format: date-time }
    IdentityCreate:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [serial, chassis_id, sys_object_id, mac, hostname, mgmt_ip] }
        value:
          type: string
          description: Identity value; MAC values and management IPs must parse (canonicalized on write).
    PollHealthRecord:
      type: object
      required: [id, device_id, collector_id, poll_type, checked_at, latency_ms, outcome, error_class, consecutive_failures, origin]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        collector_id: { type: string, format: uuid }
        poll_type: { type: string, description: 'icmp in M9-S1; snmp arrives with M9-S2' }
        checked_at: { type: string, format: date-time }
        latency_ms: { type: integer, minimum: 0, description: Whole-probe duration in milliseconds }
        outcome: { type: string, enum: [success, failure] }
        error_class: { type: string, description: 'timeout | loss | unreachable | unsupported | ... (empty on success without loss)' }
        consecutive_failures: { type: integer, minimum: 0 }
        origin: { type: string, enum: [scheduled, on_demand], description: 'Probe trigger: scheduled cadence or on-demand check (M10-S0)' }
    DeviceStatus:
      type: object
      required: [device_id, status, down_threshold, freshness_seconds]
      description: "Poll-health-derived rollup (M10-S1). Only scheduled polls count; down requires the documented consecutive-failure threshold; unknown when no scheduled row is fresh within the freshness window."
      properties:
        device_id: { type: string, format: uuid }
        status: { type: string, enum: [up, down, unknown], description: "up = newest scheduled poll succeeded or its failure streak is below the threshold; down = consecutive failures >= down_threshold; unknown = no scheduled health within freshness_seconds" }
        since: { type: [string, 'null'], format: date-time, description: "Start of the current status run (lower bound when the run exceeds the bounded history walk); for unknown, when the newest row became stale" }
        last_outcome: { type: [string, 'null'], description: "success | failure; null when no scheduled health exists" }
        last_error_class: { type: [string, 'null'] }
        last_latency_ms: { type: [integer, 'null'], minimum: 0 }
        consecutive_failures: { type: [integer, 'null'], minimum: 0 }
        last_checked_at: { type: [string, 'null'], format: date-time }
        down_threshold: { type: integer, description: "Consecutive scheduled failures required for down (documented choice: 3)" }
        freshness_seconds: { type: integer, description: "Freshness window before a missing scheduled row means unknown (documented choice: 1200 s, covering the 15 min backoff ceiling + jitter + batching)" }
    Interface:
      type: object
      required: [id, device_id, if_index, if_name, role, monitored, first_seen_at, status, freshness_seconds]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        if_index: { type: integer, description: 'SNMP ifIndex; stored, never the identity (canonical identity is device_id + if_name + if_alias + mac) and rebound audited through the M10-S2 ingest association' }
        if_name: { type: string }
        if_alias: { type: [string, 'null'] }
        if_type: { type: [integer, 'null'] }
        admin_status: { type: [string, 'null'] }
        oper_status: { type: [string, 'null'] }
        speed_bps: { type: [integer, 'null'] }
        mtu: { type: [integer, 'null'] }
        mac: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        role: { type: string, enum: [uplink, access, trunk, unused, unknown] }
        monitored: { type: boolean }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [up, down, unknown], description: 'Live rollup from the newest SNMP observation + freshness (M10-S2): up = fresh oper_status up; down = any other fresh known state; unknown = never observed or stale' }
        freshness_seconds: { type: integer, description: 'Interface rollup freshness window in seconds (M10-S2)' }
    InterfaceCreate:
      type: object
      required: [if_index, if_name]
      properties:
        if_index: { type: integer, minimum: 1 }
        if_name: { type: string }
        if_alias: { type: [string, 'null'] }
        if_type: { type: [integer, 'null'] }
        admin_status: { type: [string, 'null'] }
        oper_status: { type: [string, 'null'] }
        speed_bps: { type: [integer, 'null'] }
        mtu: { type: [integer, 'null'] }
        mac: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        role: { type: string, enum: [uplink, access, trunk, unused, unknown], default: unknown }
        monitored: { type: boolean, default: true }
    InterfaceUpdate:
      type: object
      description: All fields optional; omitted fields are unchanged and null clears nullable fields. if_index is immutable.
      properties:
        if_name: { type: string }
        if_alias: { type: [string, 'null'] }
        if_type: { type: [integer, 'null'] }
        admin_status: { type: [string, 'null'] }
        oper_status: { type: [string, 'null'] }
        speed_bps: { type: [integer, 'null'] }
        mtu: { type: [integer, 'null'] }
        mac: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        role: { type: string, enum: [uplink, access, trunk, unused, unknown] }
        monitored: { type: boolean }
    DeviceGroup:
      type: object
      required: [id, name, selector, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        selector: { type: object, additionalProperties: true, description: Dynamic membership rule; usable as a credential/rule scope }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DeviceGroupCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        selector: { type: object, additionalProperties: true }
    DeviceGroupUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        selector: { type: object, additionalProperties: true }
    CredentialMetadata:
      type: object
      required: [id, name, kind, metadata, created_at, updated_at, bindings]
      description: >
        API-safe projection of a credential. There is no secret field, no
        envelope column, and no key material: the store keeps the ciphertext
        envelope out of every response by construction.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        kind: { type: string, description: 'Credential kind, e.g. snmp_v2c, snmp_v3, ssh_paramiko' }
        metadata: { type: object, additionalProperties: true, description: Non-secret descriptor (username hints, policies) }
        rotated_at: { type: [string, 'null'], format: date-time, description: Last envelope rotation (if any) }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        bindings:
          type: array
          description: Binding summaries (scope + priority); full binding semantics are enforced by dispatch resolution (M9).
          items: { $ref: '#/components/schemas/CredentialBinding' }
    CredentialBinding:
      type: object
      required: [id, scope_type, scope_id, priority, created_at]
      properties:
        id: { type: string, format: uuid }
        scope_type: { type: string, enum: [org, site, device_group, device] }
        scope_id: { type: string, format: uuid }
        priority: { type: integer, description: Higher wins within one scope level at dispatch resolution }
        created_at: { type: string, format: date-time }
    CredentialCreate:
      type: object
      required: [name, kind, secret]
      properties:
        name: { type: string, maxLength: 200 }
        kind: { type: string, description: 'e.g. snmp_v2c, snmp_v3, ssh_paramiko' }
        secret:
          type: string
          minLength: 1
          description: >
            The secret value (SNMP community, SNMPv3 auth/priv keys, SSH
            password). Write-only: sealed into the envelope and never returned.
        metadata: { type: object, additionalProperties: true }
    CredentialRotateRequest:
      type: object
      required: [secret]
      properties:
        secret: { type: string, minLength: 1, description: 'New secret value; write-only, never returned.' }
    CredentialBindRequest:
      type: object
      required: [scope_type, scope_id]
      properties:
        scope_type: { type: string, enum: [org, site, device_group, device] }
        scope_id: { type: string, format: uuid, description: 'Must exist in the caller tenant (org targets: the caller org).' }
        priority: { type: integer, default: 0, description: Higher wins within one scope level. }
    CredentialUnbindRequest:
      type: object
      required: [scope_type, scope_id]
      properties:
        scope_type: { type: string, enum: [org, site, device_group, device] }
        scope_id: { type: string, format: uuid }
    MetricSeries:
      type: object
      required: [metric, unit, resolution, from, to, points, meta, status]
      properties:
        metric: { type: string }
        unit: { type: string }
        resolution: { type: string, enum: [raw, 10s, 1m, 5m, 1h, 1d] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        status:
          type: string
          enum: [no_data, fresh, stale]
          description: "Freshness of the latest sample (M4c addition): fresh when age <= max(3x policy interval, 30s)."
        latest:
          type: object
          description: Most recent stored sample; omitted when the series has no data.
          properties:
            ts: { type: string, format: date-time }
            value: { type: number }
            age_seconds: { type: integer }
            status: { type: string, enum: [fresh, stale] }
        points:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
            description: '[unix_seconds, value]; contiguous with step; gaps explicit in meta'
        meta:
          type: object
          description: "Query metadata (M8): resolution class, caps and raw-fallback flags."
          properties:
            expected_points: { type: integer }
            returned_points: { type: integer }
            gaps: { type: integer }
            truncated: { type: boolean }
            sample_count:
              type: integer
              description: Raw samples matched in range (M4c addition).
            resolution:
              type: string
              enum: [raw, rollup_1m, rollup_5m, rollup_1h, rollup_1d]
              description: "Canonical resolution class (docs/12 §22.8 example)."
            partial:
              type: boolean
              description: "True when the series or point caps truncated the response (P2-AC-13)."
            series_total: { type: integer }
            series_returned: { type: integer }
            points_truncated: { type: boolean }
            raw_fallback:
              type: boolean
              description: "True when the recent span was computed from raw samples because the CAGG has not materialized it yet (P2-AC-07)."
            rollup_missing:
              type: boolean
              description: "True when no materialization existed for the older span and it was recomputed from raw."
            resolution_warning:
              type: string
              description: "Present when an explicit step is finer than the picker's recommendation for the range."
    MetricsSelector:
      type: object
      required: [device_id, metric_key]
      properties:
        device_id: { type: string, format: uuid }
        metric_key: { type: string, maxLength: 200 }
        dimensions:
          type: object
          additionalProperties: { type: string }
          description: "Dimension subset; a series matches when its stored dimensions are a superset (docs/08 §13.5 selector semantics)"
    MetricsQueryRequest:
      type: object
      required: [series, from, to]
      properties:
        series:
          type: array
          minItems: 1
          maxItems: 100
          items:
            oneOf:
              - { type: string, description: "Opaque series id (s_…) from a previous response" }
              - { $ref: '#/components/schemas/MetricsSelector' }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        step: { type: string, enum: [auto, raw, 10s, 30s, 1m, 5m, 1h, 1d], default: auto }
        agg: { type: string, enum: [avg, max, p95, rate, sum], default: avg, description: "p95 is served from raw samples (not materialized in CAGGs; only as complete as raw retention)" }
        fill: { type: string, enum: [null, zero, previous], default: null, description: "Gap policy for bucketed steps; raw steps return exact samples" }
    MetricsQueryResponse:
      type: object
      required: [from, to, step, agg, fill, series, meta]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        step: { type: string }
        agg: { type: string }
        fill: { type: string }
        series:
          type: array
          items: { $ref: '#/components/schemas/MetricMatrixSeries' }
        meta: { $ref: '#/components/schemas/MetricMatrixMeta' }
    MetricMatrixSeries:
      type: object
      required: [id, metric_key, unit, dimensions, labels, points, truncated]
      properties:
        id: { type: string, description: "Opaque series id (s_…)" }
        device_id: { type: [string, 'null'], format: uuid }
        collector_id: { type: [string, 'null'], format: uuid }
        metric_key: { type: string }
        unit: { type: string }
        dimensions: { type: object, additionalProperties: { type: string } }
        labels:
          type: object
          additionalProperties: { type: string }
          description: "Chart labels: dimensions plus metric/unit and the device name when available"
        points:
          type: array
          description: "[unix_seconds, value]; null is an explicit gap and is never interpolated"
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: [number, 'null'] }
        truncated: { type: boolean, description: "True when the response point budget dropped this series' oldest buckets" }
    MetricMatrixMeta:
      type: object
      properties:
        resolution: { type: string, enum: [raw, rollup_1m, rollup_5m, rollup_1h, rollup_1d] }
        partial: { type: boolean, description: "True when the series or point caps truncated the response" }
        points_truncated: { type: boolean }
        series_total:
          type: integer
          description: "Matched series (exact when partial=false; a lower bound when a selector matched more than 100 series)"
        series_returned: { type: integer }
        raw_fallback: { type: boolean, description: "True when raw samples served part (or all, for p95) of the window" }
        rollup_missing: { type: boolean }
        resolution_warning: { type: string }
        expected_points: { type: integer }
        returned_points: { type: integer }
        quality:
          type: object
          properties:
            gaps: { type: integer, description: "Expected buckets with no observed sample, before fill" }
            dropped_samples: { type: integer, description: "Always 0: samples are never dropped by the query path" }

security:
  - sessionCookie: []
