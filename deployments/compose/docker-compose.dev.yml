# deployments/compose/docker-compose.dev.yml
# M0 scope: db + server + collector. The migrate service and web service are added
# in M1/M2 (see docs/phase-1/PHASE_1_FILE_PLAN.md). Image tags are pinned; digest
# pinning is a tracked M0/M1 task (requires a Docker host; see docs/phase-1/VERSIONS.md).
name: argus-dev

services:
  db:
    image: timescale/timescaledb:2.30.1-pg18@sha256:9dede0e3ccc071cf71935b17f76bf243331df0b1575338c8ac294640fcf12a36
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus_owner
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 image layout: PGDATA lives under /var/lib/postgresql/18/docker and
      # the image declares /var/lib/postgresql as its volume target. Mounting the legacy
      # /var/lib/postgresql/data path makes the PG18 entrypoint treat the mount as
      # foreign data and refuse to start. Regression-checked by scripts/check-compose.ps1
      # (also enforced in CI's compose-smoke job).
      - db-data:/var/lib/postgresql
      # Init script mounted as a FILE on purpose: a directory mount over
      # /docker-entrypoint-initdb.d would hide the image's own scripts
      # (000_install_timescaledb.sh, 001_timescaledb_tune.sh) and silently skip
      # TimescaleDB extension installation and tuning. Also regression-checked.
      - ../../scripts/db-init/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus_owner -d argus"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ../..
      dockerfile: deployments/compose/Dockerfile.server
      args:
        VERSION: dev
        COMMIT: none
        BUILD_DATE: unknown
    command: ["migrate"]
    environment:
      ARGUS_SERVER_MIGRATE_DSN: "postgres://argus_owner:devpass@db:5432/argus?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: ../..
      dockerfile: deployments/compose/Dockerfile.server
      args:
        VERSION: dev
        COMMIT: none
        BUILD_DATE: unknown
    command: ["seed-dev"]
    environment:
      ARGUS_ENV: dev
      ARGUS_SERVER_DB_DSN: "postgres://argus_app_login:devpass@db:5432/argus?sslmode=disable"
      ARGUS_SERVER_AUTH_DB_DSN: "postgres://argus_auth_login:devpass@db:5432/argus?sslmode=disable"
      ARGUS_DEV_ADMIN_PASSWORD: "dev-admin-changeme"
    depends_on:
      migrate:
        condition: service_completed_successfully

  server:
    build:
      context: ../..
      dockerfile: deployments/compose/Dockerfile.server
      args:
        VERSION: dev
        COMMIT: none
        BUILD_DATE: unknown
    environment:
      ARGUS_ENV: dev
      ARGUS_LOG_LEVEL: info
      ARGUS_SERVER_HTTP_ADDR: ":8080"
      ARGUS_SERVER_OPS_ADDR: ":9090"
      ARGUS_SERVER_GRPC_ADDR: ":8443"
      ARGUS_SERVER_ENROLL_ADDR: ":8444"
      # DSNs are consumed from M1 onward (readiness, migrations, auth lookups).
      ARGUS_SERVER_DB_DSN: "postgres://argus_app_login:devpass@db:5432/argus?sslmode=disable"
      ARGUS_SERVER_AUTH_DB_DSN: "postgres://argus_auth_login:devpass@db:5432/argus?sslmode=disable"
      ARGUS_SERVER_MIGRATE_DSN: "postgres://argus_owner:devpass@db:5432/argus?sslmode=disable"
      ARGUS_SERVER_CA_DIR: /var/lib/argus/ca
      ARGUS_DEV_SEED: "true"
    ports:
      - "8080:8080"
      - "8443:8443"
      - "8444:8444"
      - "9090:9090"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/argus-server", "healthcheck", "-url", "http://127.0.0.1:8080/v1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        ARGUS_API_BASE: "http://server:8080"
    environment:
      NODE_ENV: production
      ARGUS_API_BASE: "http://server:8080"
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

  collector:
    build:
      context: ../..
      dockerfile: deployments/compose/Dockerfile.collector
      args:
        VERSION: dev
        COMMIT: none
        BUILD_DATE: unknown
    environment:
      ARGUS_LOG_LEVEL: info
      ARGUS_COLLECTOR_SERVER: "https://server:8444"
      ARGUS_COLLECTOR_STREAM: "server:8443"
      ARGUS_COLLECTOR_DATA_DIR: /var/lib/argus
      ARGUS_COLLECTOR_SPOOL_MAX_BYTES: "67108864"
      ARGUS_COLLECTOR_FSYNC_INTERVAL_MS: "1000"
    volumes:
      - collector-data:/var/lib/argus
    depends_on:
      server:
        condition: service_healthy

volumes:
  db-data:
  collector-data:
