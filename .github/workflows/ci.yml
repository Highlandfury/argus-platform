name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# NOTE (self-hosted CI): the account's GitHub-hosted Action minutes are
# billing-locked, so every job targets this repository's self-hosted Linux
# runner with labels: self-hosted, linux, x64, argus.
# Setup instructions: docs/phase-1/RUNBOOK.md Â§17.
# To revert to GitHub-hosted runners, replace the runs-on values with
# `ubuntu-latest` (all jobs).

env:
  GOTOOLCHAIN: local

jobs:
  build-test:
    name: build & test (Go)
    runs-on: [self-hosted, linux, x64, argus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./...
      - name: build
        run: |
          go build ./...
          go build -o /tmp/argus-server ./cmd/argus-server
          go build -o /tmp/argus-collector ./cmd/argus-collector

  lint:
    name: lint
    runs-on: [self-hosted, linux, x64, argus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  proto:
    name: proto (lint, drift, breaking)
    runs-on: [self-hosted, linux, x64, argus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - name: install pinned buf + protoc plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: buf lint
        run: buf lint
      - name: drift check (regenerate + diff against committed gen/)
        run: |
          buf generate
          git diff --exit-code -- gen
      - name: build generated code
        run: go build ./gen/...
      - name: breaking changes (vs origin/main, when available)
        run: |
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            buf breaking --against '.git#branch=origin/main'
          else
            echo "origin/main not present; skipping breaking check (pre-first-push)"
          fi

  contract:
    name: OpenAPI contract
    runs-on: [self-hosted, linux, x64, argus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - name: spec validity + route alignment
        run: go test ./tests/contract/... -count=1

  failure-suite:
    name: failure suite (T1-T10; nightly/release)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, argus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - name: failure suite (T1-T10, testcontainers)
        run: go test ./tests/integration/... -run '^TestFailureSuite$' -count=1 -v

  e2e:
    name: e2e (compose stack)
    runs-on: [self-hosted, linux, x64, argus]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - name: compose up (build + wait for healthy; isolated project, no host ports)
        run: |
          docker compose -p argus-ci \
            -f deployments/compose/docker-compose.dev.yml \
            -f deployments/compose/docker-compose.ci.yml \
            up -d --build --wait db migrate seed server
      - name: attach runner to the compose network (service DNS)
        run: docker network connect argus-ci_default "$(hostname)" || true
      - name: extract internal CA (pinned trust for the harness)
        run: |
          docker compose -p argus-ci \
            -f deployments/compose/docker-compose.dev.yml \
            -f deployments/compose/docker-compose.ci.yml \
            cp server:/var/lib/argus/ca/root.pem e2e-ca.pem
      - name: e2e harness (AC-01/02/03/08, T7)
        env:
          ARGUS_E2E: "1"
          ARGUS_E2E_API: "http://server:8080"
          ARGUS_E2E_OPS: "http://server:9090"
          ARGUS_E2E_ENROLL: "https://server:8444"
          ARGUS_E2E_STREAM: "server:8443"
          ARGUS_E2E_CA: e2e-ca.pem
        run: go test ./tests/e2e/... -count=1 -v
      - name: compose logs (on failure)
        if: failure()
        run: |
          docker compose -p argus-ci \
            -f deployments/compose/docker-compose.dev.yml \
            -f deployments/compose/docker-compose.ci.yml \
            logs --tail=100
      - name: compose down
        if: always()
        run: |
          docker network disconnect argus-ci_default "$(hostname)" 2>/dev/null || true
          docker compose -p argus-ci \
            -f deployments/compose/docker-compose.dev.yml \
            -f deployments/compose/docker-compose.ci.yml \
            down -v --remove-orphans

  security-suite:
    name: security suite (S-01..S-16; release gate)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, argus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - name: security suite (S-01..S-16, testcontainers)
        run: go test ./tests/integration/... -run '^TestSecuritySuite$' -count=1 -v

  compat-matrix:
    name: compat matrix (PG18 + TimescaleDB 2.30.1)
    runs-on: [self-hosted, linux, x64, argus]
    services:
      db:
        image: timescale/timescaledb:2.30.1-pg18
        env:
          POSTGRES_DB: argus
          POSTGRES_USER: argus_owner
          POSTGRES_PASSWORD: dev-db-change-me
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U argus_owner -d argus"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: verify extension, hypertable, idempotent conflict handling
        env:
          PGPASSWORD: dev-db-change-me
        run: |
          for h in host.docker.internal 127.0.0.1; do
            if pg_isready -q -h "$h" -p 15432 -U argus_owner -d argus; then
              PGHOST="$h"; export PGHOST; break
            fi
          done
          echo "using PGHOST=$PGHOST"
          psql -h "$PGHOST" -p 15432 -U argus_owner -d argus -v ON_ERROR_STOP=1 <<'SQL'
          SELECT version();
          SELECT extversion FROM pg_extension WHERE extname = 'timescaledb';
          CREATE TABLE smoke(
            org uuid NOT NULL,
            ts  timestamptz NOT NULL,
            v   double precision NOT NULL,
            PRIMARY KEY (org, ts)
          );
          SELECT create_hypertable('smoke', 'ts',
            chunk_time_interval => INTERVAL '1 day',
            create_default_indexes => false);
          INSERT INTO smoke VALUES ('00000000-0000-0000-0000-000000000001', '2026-01-01T00:00:00Z', 1)
            ON CONFLICT DO NOTHING;
          INSERT INTO smoke VALUES ('00000000-0000-0000-0000-000000000001', '2026-01-01T00:00:00Z', 2)
            ON CONFLICT DO NOTHING;
          DO $$
          BEGIN
            IF (SELECT count(*) FROM smoke) <> 1 THEN
              RAISE EXCEPTION 'idempotent ON CONFLICT smoke failed: expected 1 row';
            END IF;
          END
          $$;
          SQL

  compose-smoke:
    name: compose smoke (db + server + collector)
    runs-on: [self-hosted, linux, x64, argus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: assert PostgreSQL 18 volume layout and safe init mounts
        run: |
          targets=$(docker compose -f deployments/compose/docker-compose.dev.yml config --format json \
            | grep -oE '"target": *"[^"]+"' | sed 's/.*"target": *"//; s/"$//' | sort -u)
          echo "$targets"
          echo "$targets" | grep -qx "/var/lib/postgresql"
          if echo "$targets" | grep -qx "/var/lib/postgresql/data"; then
            echo "ERROR: PG17-style volume target detected; PG18 images require /var/lib/postgresql"
            exit 1
          fi
          if echo "$targets" | grep -qx "/docker-entrypoint-initdb.d"; then
            echo "ERROR: directory mount over /docker-entrypoint-initdb.d hides the image's own init scripts (TimescaleDB extension install/tune)"
            exit 1
          fi
      - name: build and start stack (isolated project, no host ports)
        run: |
          docker compose -p argus-ci \
            -f deployments/compose/docker-compose.dev.yml \
            -f deployments/compose/docker-compose.ci.yml \
            up -d --build --wait db migrate seed server collector
      - name: attach runner to the compose network (service DNS)
        run: docker network connect argus-ci_default "$(hostname)" || true
      - name: probe healthz
        run: curl -fsS http://server:8080/v1/healthz
      - name: probe readyz (database + schema + auth-role checks)
        run: |
          curl -fsS http://server:8080/v1/readyz | tee /tmp/readyz.json
          grep -q '"database":"ok"' /tmp/readyz.json
          grep -q '"auth_database":"ok"' /tmp/readyz.json
          echo "readyz checks OK"
      - name: probe metrics
        run: curl -fsS http://server:9090/metrics | grep -q argus_build_info
      - name: stack logs (on failure)
        if: failure()
        run: |
          docker compose -p argus-ci \
            -f deployments/compose/docker-compose.dev.yml \
            -f deployments/compose/docker-compose.ci.yml \
            logs --tail=200
      - name: teardown
        if: always()
        run: |
          docker network disconnect argus-ci_default "$(hostname)" 2>/dev/null || true
          docker compose -p argus-ci \
            -f deployments/compose/docker-compose.dev.yml \
            -f deployments/compose/docker-compose.ci.yml \
            down -v --remove-orphans

  web:
    name: web build (when present)
    runs-on: [self-hosted, linux, x64, argus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.21.0"
      - name: build
        if: ${{ hashFiles('web/package.json') != '' }}
        working-directory: web
        run: |
          npm ci
          npm run build
